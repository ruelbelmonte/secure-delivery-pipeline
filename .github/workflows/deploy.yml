name: deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image-digest:
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ inputs.image-digest }}
      CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
      CERT_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Validate digest
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::image-digest must be sha256:<64 hex>"; exit 1; }
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify signature and SBOM attestation
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$CERT_ISSUER" > /dev/null
          cosign verify-attestation "$IMAGE@$DIGEST" --type spdxjson \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$CERT_ISSUER" > /dev/null
          echo "Verified $IMAGE@$DIGEST was signed by $CERT_IDENTITY"

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: ${{ inputs.environment }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create pull secret
        run: |
          kubectl create secret generic ghcr-pull \
            --type=kubernetes.io/dockerconfigjson \
            --from-file=.dockerconfigjson="$HOME/.docker/config.json"

      - name: Helm install
        run: |
          helm upgrade --install weather-api ./deploy/chart \
            --set image.repository="$IMAGE" \
            --set image.digest="$DIGEST" \
            --set "imagePullSecrets[0].name=ghcr-pull" \
            --wait --timeout 3m
          kubectl rollout status deployment/weather-api --timeout=2m

      - name: Smoke test /health
        run: |
          kubectl port-forward service/weather-api 8080:80 &
          body=$(curl --silent --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8080/health)
          [[ "$body" == "Healthy" ]] || { echo "::error::unexpected /health response: $body"; exit 1; }

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe deployment weather-api || true
          kubectl logs deployment/weather-api --tail=100 || true
