name: terraform-apply

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] guarded below: push-to-main runs of this repo only
    workflows: [terraform-plan]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  apply:
    # The branches filter matches a fork PR's head branch name too, so also require a push to this repo.
    if: >-
      vars.AWS_ROLE_ARN != '' && vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: prod
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # download the plan artifact from the triggering run
      id-token: write # assume the apply role via GitHub OIDC
    defaults:
      run:
        working-directory: infra
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: infra
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
      # Applies the reviewed plan file as-is; Terraform rejects it if state moved since it was made.
      - run: terraform apply -input=false tfplan
