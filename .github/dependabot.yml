version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories: ["/infra", "/infra/bootstrap"]
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
